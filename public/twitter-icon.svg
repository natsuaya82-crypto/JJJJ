<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#0d2a5a"/>
      <stop offset="100%" stop-color="#040c1a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="mtgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Mountain silhouette -->
  <path d="M0,400 L60,260 L110,300 L170,180 L220,230 L280,110 L330,175 L390,145 L400,155 L400,400 Z"
    fill="url(#mtgrad)"/>

  <!-- Road lines -->
  <line x1="200" y1="400" x2="100" y2="250" stroke="white" stroke-width="0.8" stroke-opacity="0.08"/>
  <line x1="200" y1="400" x2="300" y2="250" stroke="white" stroke-width="0.8" stroke-opacity="0.08"/>
  <line x1="200" y1="400" x2="50"  y2="300" stroke="white" stroke-width="0.6" stroke-opacity="0.05"/>
  <line x1="200" y1="400" x2="350" y2="300" stroke="white" stroke-width="0.6" stroke-opacity="0.05"/>

  <!-- Top label -->
  <text x="200" y="118"
    font-family="'Saira Condensed','Arial Narrow',Arial,sans-serif"
    font-weight="700" font-size="16"
    fill="#f5c842" fill-opacity="0.6"
    text-anchor="middle" letter-spacing="8">JPEL OFFICIAL</text>

  <!-- EKIDEN -->
  <text x="200" y="215"
    font-family="'Saira Condensed','Arial Narrow',Arial,sans-serif"
    font-weight="900" font-size="95"
    fill="white"
    text-anchor="middle" letter-spacing="2">EKIDEN</text>

  <!-- MANAGER in gold -->
  <text x="200" y="298"
    font-family="'Saira Condensed','Arial Narrow',Arial,sans-serif"
    font-weight="900" font-size="95"
    fill="url(#gold)"
    text-anchor="middle" letter-spacing="2">MANAGER</text>

  <!-- Gold separator line -->
  <rect x="120" y="314" width="160" height="3" rx="1.5" fill="url(#gold)" opacity="0.7"/>

  <!-- Bottom tagline -->
  <text x="200" y="348"
    font-family="'Saira Condensed','Arial Narrow',Arial,sans-serif"
    font-weight="400" font-size="14"
    fill="#8c9aaf"
    text-anchor="middle" letter-spacing="3">SIMULATION</text>
</svg>
