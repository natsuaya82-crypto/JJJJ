name: iOS Deploy to App Store

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -name "Xcode_26*.app" -maxdepth 1 | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Using: $XCODE"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # アプリ内の判定バージョン(appMeta APP_VERSION)とネイティブの MARKETING_VERSION の
      # ズレを検出したらビルドを止める。ズレたまま配信すると「最新版なのに
      # アップデートしてくださいが出る」事故（強制アップデート誤表示）が再発するため。
      - name: Verify version consistency
        run: |
          META_VER=$(grep -o "APP_VERSION = 'v[^']*'" src/data/appMeta.ts | sed "s/.*'v\(.*\)'/\1/")
          IOS_VER=$(grep -m1 -o 'MARKETING_VERSION = [^;]*' ios/App/App.xcodeproj/project.pbxproj | sed 's/MARKETING_VERSION = //')
          echo "appMeta APP_VERSION=$META_VER / iOS MARKETING_VERSION=$IOS_VER"
          if [ -z "$META_VER" ] || [ "$META_VER" != "$IOS_VER" ]; then
            echo "::error::バージョン不一致: appMeta v$META_VER vs iOS $IOS_VER — どちらかの上げ忘れ。両方を揃えてから再ビルドしてください"
            exit 1
          fi

      # ビルド番号(CFBundleVersion)は「タグ名 build-NN の NN」を唯一の正とする。
      # pbxproj の CURRENT_PROJECT_VERSION を手で上げ忘れると、ビルドもアーカイブも
      # 全部成功したうえで最後のアップロードだけが 409
      # 「The bundle version must be higher than the previously uploaded version」で落ちる。
      # タグは毎回必ず上げるので、そこから機械的に書き込めば上げ忘れが起こらない。
      - name: Set build number from tag
        run: |
          REF="${GITHUB_REF_NAME}"
          case "$REF" in
            build-*) BUILD_NO="${REF#build-}" ;;
            *) BUILD_NO="" ;;
          esac
          if [ -z "$BUILD_NO" ]; then
            echo "タグ起動ではないため pbxproj の値をそのまま使います"
            grep -m1 -o 'CURRENT_PROJECT_VERSION = [^;]*' ios/App/App.xcodeproj/project.pbxproj
            exit 0
          fi
          case "$BUILD_NO" in
            ''|*[!0-9]*) echo "::error::タグ名から数値のビルド番号を取り出せません: $REF （build-65 の形式にしてください）"; exit 1 ;;
          esac
          sed -i '' -e "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NO};/g" ios/App/App.xcodeproj/project.pbxproj
          echo "CFBundleVersion = ${BUILD_NO}"
          grep -n 'CURRENT_PROJECT_VERSION' ios/App/App.xcodeproj/project.pbxproj

      - name: Build web
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync iOS
        run: npx cap sync ios

      - name: Install Apple Distribution Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build & Archive iOS
        run: |
          # 署名設定は App ターゲットの build settings 側に持たせる（project.pbxproj）。
          # ここでコマンドラインに渡すと SPM 依存(Alamofire/ZIPFoundation 等)にも波及して
          # 「does not support provisioning profiles」で archive が失敗するため、渡さない。
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            -destination "generic/platform=iOS"

      - name: Export IPA
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>9B2R9YPV5B</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tokinets.jpelmanager</key>
              <string>JPEL Manager Distribution</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: build/ipa/App.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.IOS_KEY_ID }}
          api-private-key: ${{ secrets.IOS_API_KEY }}
          # アップロード後の「処理完了待ち」を無効化。待機中にAPIトークンが期限切れになり
          # 401でワークフローが失敗表示になるのを防ぐ。アップロード自体は待ち有無に関係なく完了する。
          wait-for-processing: false
